name: Flutter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 30s
      - run: flutter build web --no-web-resources-cdn --no-tree-shake-icons --dart-define-from-file=config/public.json
      - run: flutter build apk --debug --dart-define-from-file=config/public.json
      - name: Build Wear OS
        run: cd android && ./gradlew :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wear-os-preview
          path: build/wear/outputs/apk/debug/wear-debug.apk
  apple:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Build iPhone and embedded watch simulator apps
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, rows in devices.items() if ".iOS-" in runtime for d in rows if d.get("isAvailable") and d["name"].startswith("iPhone")))')"
          flutter build ios --simulator --debug --no-codesign -d "$simulator_id" --dart-define-from-file=config/public.json
      - name: Build Apple Watch simulator
        run: xcodebuild -project ios/Runner.xcodeproj -scheme CommunityWatch -configuration Debug -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
