name: community_app
description: A configurable worship, learning and community app.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.17.2
  flutter_secure_storage: 11.1.1
  shared_preferences: 2.5.5
  intl: 0.20.3
  timezone: 0.11.1
  just_audio: 0.10.6
  just_audio_background: 0.0.1-beta.17
  audio_session: 0.2.4
  url_launcher: 6.3.2
  http: 1.6.0
  geolocator: 14.0.3
  flutter_compass: 0.8.1
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  flutter_local_notifications: 22.3.1
  home_widget: 0.9.4
  share_plus: 13.3.0
  file_picker: 12.3.0
  archive: 4.2.0
  path_provider: 2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/organisation.json
    - assets/programmes.json
    - assets/brand/
    - assets/posters/
    - assets/reading/
    - assets/fonts/NotoNaskhArabic-OFL.txt

  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
